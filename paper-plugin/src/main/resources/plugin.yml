name: RexSpielCompanions
version: '${version}'
main: ai.rexspiel.companions.RexSpielCompanions
api-version: '1.21'
author: RexSpiel AI
description: PaperMC per-player combat companions with 50 randomized powers.
commands:
  rex:
    description: Manage your RexSpiel companion
    usage: /rex <claim|summon|dismiss|power|powers|status>
    aliases: [rexspiel]
  tpa:
    description: Request teleport to another player
  tpaccept:
    description: Accept a teleport request
  tpdeny:
    description: Deny a teleport request
  sethome:
    description: Set a home
  home:
    description: Teleport to a home
  delhome:
    description: Delete a home
  money:
    description: View your balance
  pay:
    description: Pay another player
  sell:
    description: Sell items for money
  coords:
    description: Show your coordinates
permissions:
  rex.admin:
    default: op
